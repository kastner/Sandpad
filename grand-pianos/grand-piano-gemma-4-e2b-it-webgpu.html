<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Audio Piano</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        #piano {
            display: flex;
            gap: 5px;
            padding: 20px;
            background-color: #333;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        key {
            width: 80px;
            height: 200px;
            background-color: white;
            border: 1px solid #333;
            cursor: pointer;
            position: relative;
            transition: background-color 0.1s;
            user-select: none;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }

        white {
            background-color: #f9f9f9;
            border: 1px solid #aaa;
            z-index: 1;
        }

        black {
            background-color: #333;
            border: 1px solid #111;
            z-index: 2;
        }

        key-top {
            height: 150px;
            border-bottom: none;
        }

        key-bottom {
            height: 250px;
        }

        key:active {
            background-color: #ccc;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        black:active {
            background-color: #555;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.7);
        }

        label {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #333;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="piano">
        <!-- White Keys -->
        <div class="key white" data-note="C4"></div>
        <div class="key white" data-note="D4"></div>
        <div class="key white" data-note="E4"></div>
        <div class="key white" data-note="F4"></div>
        <div class="key white" data-note="G4"></div>
        <div class="key white" data-note="A4"></div>
        <div class="key white" data-note="B4"></div>
        <div class="key white" data-note="C5"></div>

        <!-- Black Keys -->
        <div class="key black" data-note="C#4"></div>
        <div class="key black" data-note="D#4"></div>
        <div class="key black" data-note="F#4"></div>
        <div class="key black" data-note="G#4"></div>
        <div class="key black" data-note="A#4"></div>
    </div>

        // Map of musical notes to their corresponding frequency (in Hz)
        // This is a simplified mapping for demonstration.
        const noteFrequencies = {
            'C4': 261.63,
            'D4': 293.66,

            'F4': 349.23,
            'G4': 392.00,
            'A4': 440.00,
            'B4': 493.88,
            'C5': 523.25,
            'C#4': 277.18,
            'D#4': 311.13,
            'F#4': 369.99,
            'G#4': 415.30,
            'A#4': 466.16
        };

        // --- Sound Generation Function ---
        function playNote(noteName) {
            const frequency = noteFrequencies[noteName];
            if (!frequency) return;
