<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Piano Keyboard</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow-x: auto;
    padding: 20px;
  }

  .title {
    color: #fff;
    font-size: 2.5rem;
    margin-bottom: 20px;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    letter-spacing: 3px;
  }

  .subtitle {
    color: #a0a0a0;
    font-size: 0.9rem;
    margin-bottom: 30px;
    letter-spacing: 2px;
  }

  .piano-container {
    position: relative;
    background: linear-gradient(to bottom, #2c1810 0%, #1a0f08 100%);
    padding: 20px 10px 40px;
    border-radius: 12px;
    box-shadow: 
      0 20px 60px rgba(0,0,0,0.5),
      inset 0 2px 4px rgba(255,255,255,0.1),
      0 0 0 1px rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
  }

  .piano-keyboard {
    position: relative;
    display: flex;
    height: 250px;
    user-select: none;
  }

  .white-keys {
    display: flex;
    position: relative;
    z-index: 1;
    height: 100%;
  }

  .white-key {
    width: 60px;
    height: 100%;
    background: linear-gradient(to bottom, #fff 0%, #f5f5f5 50%, #e8e8e8 100%);
    border: 1px solid #ccc;
    border-bottom: none;
    border-radius: 0 0 4px 4px;
    cursor: pointer;
    transition: all 0.05s ease;
    position: relative;
    box-shadow: 
      0 4px 8px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.8);
  }

  .white-key:hover {
    background: linear-gradient(to bottom, #ffffe0 0%, #f5f5f5 50%, #e0e0e0 100%);
  }

  .white-key:active,
  .white-key.active {
    transform: translateY(2px);
    box-shadow: 
      inset 0 2px 4px rgba(0,0,0,0.3),
      0 2px 4px rgba(0,0,0,0.3);
  }

  .black-keys {
    position: absolute;
    top: 0;
    left: 60px;
    display: flex;
    z-index: 2;
    height: 60%;
  }

  .black-key {
    width: 36px;
    height: 100%;
    background: linear-gradient(to bottom, #000 0%, #1a1a1a 50%, #0d0d0d 100%);
    border: 1px solid #000;
    border-bottom: none;
    cursor: pointer;
    transition: all 0.05s ease;
    position: relative;
    margin: 0 -18px;
    box-shadow: 
      0 4px 8px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.1);
  }

  .black-key:hover {
    background: linear-gradient(to bottom, #2a2a2a 0%, #1a1a1a 50%, #111111 100%);
  }

  .black-key:active,
  .black-key.active {
    transform: translateY(3px);
    box-shadow: 
      inset 0 2px 4px rgba(0,0,0,0.5),
      0 1px 2px rgba(0,0,0,0.5);
  }

  .octave-label {
    position: absolute;
    bottom: 10px;
    color: rgba(255,255,255,0.3);
    font-size: 0.7rem;
    font-weight: bold;
    width: 60px;
    text-align: center;
  }

  .black-octave-label {
    position: absolute;
    bottom: 28px;
    color: rgba(255,255,255,0.2);
    font-size: 0.55rem;
    font-weight: bold;
    width: 36px;
    text-align: center;
    margin-left: -18px;
  }

  .instructions {
    color: #888;
    margin-top: 25px;
    text-align: center;
    font-size: 0.85rem;
    line-height: 1.8;
  }

  .note-display {
    color: rgba(255,255,255,0.7);
    margin-top: 15px;
    font-size: 0.9rem;
    min-height: 24px;
    text-align: center;
  }

  .footer {
    position: fixed;
    bottom: 10px;
    color: rgba(255,255,255,0.2);
    font-size: 0.7rem;
  }

  /* Responsive scaling */
  @media (max-width: 768px) {
    .white-key {
      width: 40px;
    }
    .black-key {
      width: 24px;
      margin: 0 -12px;
    }
    .piano-keyboard {
      height: 180px;
    }
  }

  @media (max-width: 480px) {
    .white-key {
      width: 30px;
    }
    .black-key {
      width: 18px;
      margin: 0 -9px;
    }
    .title {
      font-size: 1.8rem;
    }
  }
</style>
</head>
<body>

<h1 class="title">Grand Piano</h1>
<p class="subtitle">Piano Keyboard</p>

<div class="piano-container">
  <div class="piano-keyboard" id="piano">
    <div class="white-keys" id="whiteKeys"></div>
    <div class="black-keys" id="blackKeys"></div>
  </div>
  <div class="note-display" id="noteDisplay">Press a key to play</div>
</div>

<p class="instructions">
  Click or touch keys on screen • Use A-Z keys on keyboard • Each note is synthesized dynamically using Web Audio API
</p>

<p class="footer">Web Audio API • Grand Piano Synthesis</p>

<script>
class GrandPianoSynth {
  constructor() {
    this.audioCtx = null;
    this.gainNode = null;
    this.oscillators = new Map();
    this.envelopes = new WeakMap();
    this.currentNotes = new Set();
    
    // Piano-specific parameters with inharmonicity
    this.noteFrequencies = {
      'a0': 27.5, 'a#0': 29.14, 'b0': 30.87,
      'c1': 32.70, 'c#1': 34.65, 'd1': 36.71, 'd#1': 38.89, 'e1': 41.20,
      'f1': 43.65, 'f#1': 46.25, 'g1': 49.00, 'g#1': 51.91, 'a1': 55.00,
      'a#1': 58.27, 'b1': 61.74, 'c2': 65.41, 'c#2': 69.30, 'd2': 73.42,
      'd#2': 77.78, 'e2': 82.41, 'f2': 87.31, 'f#2': 92.50, 'g2': 98.00,
      'g#2': 103.83, 'a2': 110.00, 'a#2': 116.54, 'b2': 123.47,
      'c3': 130.81, 'c#3': 138.59, 'd3': 146.83, 'd#3': 155.56,
      'e3': 164.81, 'f3': 174.61, 'f#3': 185.00, 'g3': 196.00,
      'g#3': 207.65, 'a3': 220.00, 'a#3': 233.08, 'b3': 246.94,
      'c4': 261.63, 'c#4': 277.18, 'd4': 293.66, 'd#4': 311.13,
      'e4': 329.63, 'f4': 349.23, 'f#4': 369.99, 'g4': 392.00,
      'g#4': 415.30, 'a4': 440.00, 'a#4': 466.16, 'b4': 493.88,
      'c5': 523.25, 'c#5': 554.37, 'd5': 587.33, 'd#5': 622.25,
      'e5': 659.26, 'f5': 698.46, 'f#5': 739.99, 'g5': 783.99,
      'g#5': 830.61, 'a5': 880.00, 'a#5': 932.33, 'b5': 987.77,
      'c6': 1046.50, 'c#6': 1108.73, 'd6': 1174.66, 'd#6': 1244.51,
      'e6': 1318.51, 'f6': 1396.91, 'f#6': 1479.98, 'g6': 1567.98,
      'g#6': 1661.22, 'a6': 1760.00, 'a#6': 1864.66, 'b6': 1975.53,
      'c7': 2093.00, 'c#7': 2217.46, 'd7': 2349.32, 'd#7': 2489.02,
      'e7': 2637.02, 'f7': 2793.83, 'f#7': 2959.96, 'g7': 3135.96,
      'g#7': 3322.44, 'a7': 3520.00, 'a#7': 3729.31, 'b7': 3951.06
    };

    // Note mapping to keyboard
    this.keyMap = {
      'a': 'c3', 'w': 'c#3', 's': 'd3', 'e': 'd#3', 'd': 'e3',
      'f': 'f3', 't': 'f#3', 'g': 'g3', 'y': 'g#3', 'h': 'a3',
      'u': 'a#3', 'j': 'b3', 'k': 'c4', 'o': 'c#4', 'l': 'd4',
      '.': 'd#4', 'semicolon': 'e4', 'p': 'f4', 'i': 'f#4',
      'b': 'g4', '9': 'g#4', 'n': 'a4', ',': 'a#4', 'm': 'b4',
      '2': 'c5', '3': 'c#5', '5': 'd5', '6': 'd#5', '7': 'e5',
      'q': 'f5', '8': 'f#5', 'z': 'g5', '4': 'g#5', 'x': 'a5',
      '1': 'a#5', 'r': 'b5', '9': 'c6', 'e2': 'c#6', 'd2': 'd6'
    };

    this.initAudio();
    this.setupKeyboard();
  }

  initAudio() {
    try {
      this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      this.masterGain = this.audioCtx.createGain();
      this.masterGain.gain.value = 0.3;
      this.masterGain.connect(this.audioCtx.destination);
    } catch (e) {
      console.error('Web Audio API is not supported in this browser');
    }
  }

  createInharmonicOscillator(freq, type, time, duration) {
    if (!this.audioCtx) return;
    
    const osc = this.audioCtx.createOscillator();
    const oscGain = this.audioCtx.createGain();
    const filter = this.audioCtx.createBiquadFilter();
    const ampEnv = this.audioCtx.createGain();
    const filterEnv = this.audioCtx.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    // Add inharmonicity - higher partials are slightly detuned
    const inharmonicity = 0.002;
    const partialMultipliers = [1, 2, 3, 4, 5, 6, 7, 8];
    const detunedFreqs = partialMultipliers.map((m, i) => {
      // Add inharmonicity: f_n = n*f0 * (1 + inh * n^2)
      return freq * m * (1 + inharmonicity * m * m);
    });

    // Create multiple oscillators for richer sound
    const oscillators = detunedFreqs.map((f, i) => {
      const o = this.audioCtx.createOscillator();
      const g = this.audioCtx.createGain();
      const detune = (Math.random() - 0.5) * inharmonicity * 10;
      o.frequency.value = f + detune;
      
      // Different harmonics have different amplitudes
      const amp = 1.0 / (i + 1) * (0.8 + Math.random() * 0.4);
      g.gain.value = amp;
      o.connect(g);
      g.connect(oscGain);
      return o;
    });

    // ADSR Envelope for amplitude
    const now = time;
    const attack = 0.01;
    const decay = 0.05;
    const sustain = 0.7;
    const release = 0.3;
    
    ampEnv.gain.setValueAtTime(0, now);
    ampEnv.gain.linearRampToValueAtTime(1, now + attack);
    ampEnv.gain.linearRampToValueAtTime(sustain, now + attack + decay);
    ampEnv.gain.value = sustain;

    // Filter envelope for brightness
    filter.type = 'lowpass';
    filter.frequency.value = 2000;
    filter.Q.value = 1;
    filter.frequency.setValueAtTime(2000, now);
    filter.frequency.linearRampToValueAtTime(4000, now + attack);
    filter.frequency.linearRampToValueAtTime(300, now + attack + decay + sustain);

    oscGain.connect(ampEnv);
    ampEnv.connect(filter);
    filter.connect(this.masterGain);

    oscillators.forEach(o => {
      o.start(now);
      // Add slight frequency modulation for realism
      if (o.frequency) {
        const lfo = this.audioCtx.createOscillator();
        const lfoGain = this.audioCtx.createGain();
        lfo.frequency.value = 5 + Math.random() * 10;
        lfoGain.gain.value = 2 + Math.random() * 3;
        lfo.connect(lfoGain);
        lfoGain.connect(o.frequency);
        lfo.start(now);
        this.oscillators.set(lfo, { startTime: now, duration: duration + 0.5 });
      }
      this.oscillators.set(o, { startTime: now, duration: duration + 0.5 });
    });

    const releaseTime = now + duration;
    
    // Release phase
    setTimeout(() => {
      ampEnv.gain.cancelScheduledValues(now);
      ampEnv.gain.setValueAtTime(sustain, now + duration - 0.05);
      ampEnv.gain.linearRampToValueAtTime(0, now + duration + release);
    }, (duration - 0.1) * 1000);

    // Stop oscillators
    setTimeout(() => {
      oscillators.forEach(o => {
        try { o.stop(); } catch(e) {}
      });
    }, (duration + release + 0.5) * 1000);
  }

  playNote(keyName) {
    if (!this.audioCtx) return;
    
    const freq = this.noteFrequencies[keyName];
    if (!freq) return;

    const now = this.audioCtx.currentTime;
    const duration = 2.0;

    // Randomly choose between different piano sounds
    const types = ['sine', 'triangle', 'sawtooth'];
    const type = types[Math.floor(Math.random() * types.length)];
    
    this.createInharmonicOscillator(freq, type, now, duration);

    // Visual feedback
    const keyElement = document.querySelector(`[data-note="${keyName}"]`);
    if (keyElement) {
      keyElement.classList.add('active');
      setTimeout(() => keyElement.classList.remove('active'), 200);
    }
  }
}

class PianoKeyboard {
  constructor() {
    this.synth = new GrandPianoSynth();
    this.whiteKeys = ['a','s','d','f','g','h','j','k','l',';','p','o','i','u','y'];
    this.blackKeys = ['w','e','t','r','y','u','i','9','o','0'];
    this.init();
  }

  init() {
    this.createKeys();
    this.bindEvents();
  }

  createKeys() {
    const whiteKeysContainer = document.getElementById('whiteKeys');
    const blackKeysContainer = document.getElementById('blackKeys');

    // Create white keys with octave labels
    let keyIndex = 0;
    for (let octave = 0; octave < 4; octave++) {
      const octaveLabel = document.createElement('div');
      octaveLabel.className = 'octave-label';
      octaveLabel.textContent = octave;
      whiteKeysContainer.appendChild(octaveLabel);

      this.whiteKeys.forEach(key => {
        const keyElement = document.createElement('div');
        keyElement.className = 'white-key';
        keyElement.dataset.note = `${key}${octave}`;
        keyElement.textContent = `${key}${octave}`;
        keyElement.title = `${key}${octave}`;
        whiteKeysContainer.appendChild(keyElement);
      });

      // Black keys for this octave (except last)
      if (octave < 3) {
        const blackOctaveLabel = document.createElement('div');
        blackOctaveLabel.className = 'black-octave-label';
        blackOctaveLabel.textContent = octave;
        blackKeysContainer.appendChild(blackOctaveLabel);

        this.blackKeys.forEach(key => {
          const keyElement = document.createElement('div');
          keyElement.className = 'black-key';
          keyElement.dataset.note = `${key}${octave}`;
          blackKeysContainer.appendChild(keyElement);
        });
      }
    }

    // Add C7 at the end
    const c7Label = document.createElement('div');
    c7Label.className = 'octave-label';
    c7Label.textContent = '4';
    whiteKeysContainer.appendChild(c7Label);
    
    const c7 = document.createElement('div');
    c7.className = 'white-key';
    c7.dataset.note = 'c7';
    c7.textContent = 'c7';
    whiteKeysContainer.appendChild(c7);
  }

  bindEvents() {
    const piano = document.getElementById('piano');
    const noteDisplay = document.getElementById('noteDisplay');

    // Mouse events
    piano.addEventListener('mousedown', (e) => {
      if (e.target.classList.contains('white-key') || e.target.classList.contains('black-key')) {
        e.preventDefault();
        this.handleNoteStart(e.target.dataset.note, noteDisplay);
      }
    });

    piano.addEventListener('mouseup', (e) => {
      if (e.target.classList.contains('white-key') || e.target.classList.contains('black-key')) {
        this.handleNoteEnd(e.target.dataset.note);
      }
    });

    piano.addEventListener('mouseleave', () => {
      this.stopAllNotes();
    });

    // Touch events
    piano.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      const element = document.elementFromPoint(touch.clientX, touch.clientY);
      if (element && (element.classList.contains('white-key') || element.classList.contains('black-key'))) {
        e.preventDefault();
        this.handleNoteStart(element.dataset.note, noteDisplay);
      }
    }, { passive: false });

    piano.addEventListener('touchend', (e) => {
      this.stopAllNotes();
      const touch = e.changedTouches[0];
      const element = document.elementFromPoint(touch.clientX, touch.clientY);
      if (element) {
        this.handleNoteEnd(element.dataset.note);
      }
    });

    // Keyboard events
    document.addEventListener('keydown', (e) => {
      const key = this.getKeyFromEvent(e);
      if (key && this.synth.keyMap[key]) {
        e.preventDefault();
        this.handleNoteStart(this.synth.keyMap[key], noteDisplay);
      }
    });

    document.addEventListener('keyup', (e) => {
      const key = this.getKeyFromEvent(e);
      if (key && this.synth.keyMap[key]) {
        this.handleNoteEnd(this.synth.keyMap[key]);
      }
    });
  }

  getKeyFromEvent(e) {
    if (e.key.length === 1) return e.key.toLowerCase();
    if (e.key === 'Backspace') return ';';
    if (e.key === 'ArrowUp') return '0';
    if (e.key === 'ArrowDown') return ',';
    if (e.key === 'ArrowLeft') return '.';
    if (e.key === 'ArrowRight') return '/';
    return e.key;
  }

  handleNoteStart(note, display) {
    this.synth.playNote(note);
    if (display) {
      const noteNames = {
        'a0':'A0','a#0':'A#0','b0':'B0',
        'c1':'C1','c#1':'C#1','d1':'D1','d#1':'D#1','e1':'E1',
        'f1':'F1','f#1':'F#1','g1':'G1','g#1':'G#1','a1':'A1',
        'a#1':'A#1','b1':'B1','c2':'C2','c#2':'C#2','d2':'D2',
        'd#2':'D#2','e2':'E2','f2':'F2','f#2':'F#2','g2':'G2',
        'g#2':'G#2','a2':'A2','a#2':'A#2','b2':'B2',
        'c3':'C3','c#3':'C#3','d3':'D3','d#3':'D#3','e3':'E3',
        'f3':'F3','f#3':'F#3','g3':'G3','g#3':'G#3','a3':'A3',
        'a#3':'A#3','b3':'B3','c4':'C4','c#4':'C#4','d4':'D4',
        'd#4':'D#4','e4':'E4','f4':'F4','f#4':'F#4','g4':'G4',
        'g#4':'G#4','a4':'A4','a#4':'A#4','b4':'B4',
        'c5':'C5','c#5':'C#5','d5':'D5','d#5':'D#5','e5':'E5',
        'f5':'F5','f#5':'F#5','g5':'G5','g#5':'G#5','a5':'A5',
        'a#5':'A#5','b5':'B5','c6':'C6','c#6':'C#6','d6':'D6',
        'd#6':'D#6','e6':'E6','f6':'F6','f#6':'F#6','g6':'G6',
        'g#6':'G#6','a6':'A6','a#6':'A#6','b6':'B6',
        'c7':'C7'
      };
      display.textContent = `Playing: ${noteNames[note] || note}`;
    }
  }

  handleNoteEnd(note) {
    // Note release is handled by the synth's envelope
  }

  stopAllNotes() {
    // Visual feedback removal
    document.querySelectorAll('.white-key.active, .black-key.active').forEach(el => {
      el.classList.remove('active');
    });
  }
}

// Initialize the piano when the page loads
document.addEventListener('DOMContentLoaded', () => {
  new PianoKeyboard();
});

// Prevent default touch behaviors
document.addEventListener('touchstart', function(e) {
  if (e.target.closest('.piano-keyboard')) {
    e.preventDefault();
  }
}, { passive: false });

document.addEventListener('touchmove', function(e) {
  if (e.target.closest('.piano-keyboard')) {
    e.preventDefault();
  }
}, { passive: false });
</script>

</body>
</html>
